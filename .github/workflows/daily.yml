name: Daily Digest

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CJK font for PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q fonttools
          python -c "
          from fontTools.ttLib import TTCollection
          import os
          for ttc_path in [
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
              '/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc',
          ]:
              if os.path.exists(ttc_path):
                  ttc = TTCollection(ttc_path)
                  ttc[0].save('/tmp/cjk-font.ttf')
                  print(f'Extracted TTF from {ttc_path}')
                  break
          "

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QQ_SMTP_PASSWORD: ${{ secrets.QQ_SMTP_PASSWORD }}
        run: python main.py

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: digest-logs
          path: ~/.local/state/
          retention-days: 7
